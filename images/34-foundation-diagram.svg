<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="640" fill="#faf7f2"/>

  <text x="600" y="48" text-anchor="middle" font-size="26" fill="#2b2622" font-weight="600">Where the Beauty Actually Is</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#6b6258">Not AI code vs. engineering. Foundation, plus speed.</text>

  <!-- Panel 1: AI code alone -->
  <g transform="translate(60,120)">
    <text x="150" y="0" text-anchor="middle" font-size="16" fill="#8a3b2b" font-weight="600">AI Code Alone</text>
    <text x="150" y="20" text-anchor="middle" font-size="12" fill="#7a716a">fast, no foundation</text>

    <!-- ground line, broken -->
    <line x1="20" y1="380" x2="280" y2="380" stroke="#7a716a" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- tilted stacked blocks -->
    <g transform="rotate(-6 150 260)">
      <rect x="90" y="330" width="120" height="40" fill="#e8b4a0" stroke="#8a3b2b" stroke-width="2"/>
      <rect x="95" y="285" width="110" height="40" fill="#ecc2b1" stroke="#8a3b2b" stroke-width="2"/>
      <rect x="88" y="240" width="115" height="40" fill="#e8b4a0" stroke="#8a3b2b" stroke-width="2"/>
      <rect x="100" y="195" width="100" height="40" fill="#ecc2b1" stroke="#8a3b2b" stroke-width="2"/>
      <!-- crack -->
      <path d="M 130 330 L 145 300 L 128 270" stroke="#8a3b2b" stroke-width="2" fill="none"/>
    </g>

    <!-- no foundation, just floating above ground -->
    <text x="150" y="410" text-anchor="middle" font-size="12" fill="#8a3b2b" font-style="italic">no base — looks tall, until it doesn't</text>
  </g>

  <!-- Panel 2: Engineering alone -->
  <g transform="translate(460,120)">
    <text x="150" y="0" text-anchor="middle" font-size="16" fill="#3b5a6b" font-weight="600">Engineering Alone</text>
    <text x="150" y="20" text-anchor="middle" font-size="12" fill="#7a716a">solid, but slow to rise</text>

    <line x1="20" y1="380" x2="280" y2="380" stroke="#7a716a" stroke-width="2"/>

    <!-- deep foundation -->
    <rect x="70" y="345" width="160" height="35" fill="#b7c9cf" stroke="#3b5a6b" stroke-width="2"/>
    <rect x="80" y="380" width="140" height="18" fill="#93a9b0" stroke="#3b5a6b" stroke-width="2"/>

    <!-- one short honest storey on top -->
    <rect x="95" y="300" width="110" height="45" fill="#d4e0e3" stroke="#3b5a6b" stroke-width="2"/>

    <!-- scaffolding suggesting slow build -->
    <line x1="95" y1="300" x2="95" y2="260" stroke="#3b5a6b" stroke-width="2" stroke-dasharray="3 5"/>
    <line x1="205" y1="300" x2="205" y2="260" stroke="#3b5a6b" stroke-width="2" stroke-dasharray="3 5"/>
    <line x1="95" y1="260" x2="205" y2="260" stroke="#3b5a6b" stroke-width="2" stroke-dasharray="3 5"/>

    <text x="150" y="410" text-anchor="middle" font-size="12" fill="#3b5a6b" font-style="italic">real base — but climbs one storey at a time</text>
  </g>

  <!-- Panel 3: AI-native engineering -->
  <g transform="translate(860,120)">
    <text x="150" y="0" text-anchor="middle" font-size="16" fill="#3b6b46" font-weight="600">AI-Native Engineering</text>
    <text x="150" y="20" text-anchor="middle" font-size="12" fill="#7a716a">foundation, then speed</text>

    <line x1="20" y1="380" x2="280" y2="380" stroke="#7a716a" stroke-width="2"/>

    <!-- deep foundation, same as panel 2 -->
    <rect x="70" y="345" width="160" height="35" fill="#bfe0c6" stroke="#3b6b46" stroke-width="2"/>
    <rect x="80" y="380" width="140" height="18" fill="#9dcaa8" stroke="#3b6b46" stroke-width="2"/>

    <!-- full tall structure, built fast on top of the base -->
    <rect x="95" y="300" width="110" height="45" fill="#d7ecdb" stroke="#3b6b46" stroke-width="2"/>
    <rect x="100" y="255" width="100" height="45" fill="#d7ecdb" stroke="#3b6b46" stroke-width="2"/>
    <rect x="105" y="210" width="90" height="45" fill="#d7ecdb" stroke="#3b6b46" stroke-width="2"/>
    <rect x="112" y="175" width="76" height="35" fill="#d7ecdb" stroke="#3b6b46" stroke-width="2"/>

    <!-- small AI mark, like a crane, showing speed -->
    <line x1="150" y1="175" x2="150" y2="140" stroke="#3b6b46" stroke-width="2"/>
    <line x1="150" y1="140" x2="195" y2="140" stroke="#3b6b46" stroke-width="2"/>
    <circle cx="195" cy="140" r="4" fill="#3b6b46"/>
    <text x="150" y="410" text-anchor="middle" font-size="12" fill="#3b6b46" font-style="italic">same base, built at machine speed</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-size="14" fill="#2b2622">The base doesn't change. What AI changes is how fast you can build once it's there.</text>
</svg>
